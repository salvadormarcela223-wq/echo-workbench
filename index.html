<div class="app">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="avatar" id="avatarBox" title="点击更换头像">E</div>
      <div class="brand-text">
        <div class="brand-name" id="brandName">Echo 的工作台</div>
        <div class="brand-sub" id="brandSub">FMCG · 感官 & CMI</div>
      </div>
    </div>

    <div class="nav-label">工 作 台</div>
    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <button id="btnSync" title="云端同步"><svg><use href="#i-cloud"></use></svg>同步</button>
      <button id="btnSet" title="设置"><svg><use href="#i-cog"></use></svg>设置</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <button class="burger" id="burger"><svg><use href="#i-menu"></use></svg></button>
      <div>
        <div class="page-title" id="pgTitle">行业资讯</div>
        <div class="page-desc" id="pgDesc"></div>
      </div>
      <div class="topbar-right">
        <div class="sync-dot" id="syncDot"><i></i><span>本地</span></div>
      </div>
    </header>
    <div id="view" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden"></div>
  </main>
</div>
